# 外部模型（火山方舟）配置。
#
# 与 config.yaml 的唯一区别是模型来源：Chat 与 Embedding 都改走公网 API。
# 好处是延迟从分钟级降到秒级，且容器不再依赖宿主机 Ollama，部署少一个环节。
#
# 启用方式（任选其一）：
#   1. 备份后覆盖：cp config.yaml config.ark.yaml.bak && cp config.ark.yaml config.yaml
#   2. 若已支持 CONFIG_FILE 环境变量：CONFIG_FILE=config.ark.yaml go run ./cmd/server
#
# 前置：在 .env 中设置 ARK_API_KEY，否则启动会直接报
# "environment variable ARK_API_KEY is not set"（这是预期的清晰失败）。

openai:
  # 用 ${ENV} 引用，不要把密钥写进本文件。
  api_key: "${ARK_API_KEY}"
  # 必改：到方舟控制台「模型广场」复制目标模型的 Model ID 填这里。
  # 新版模型 ID 通常带日期版本号。
  model: "doubao-seed-2-0-pro"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  # 留空表示完全不向服务端发送该字段。
  # 方舟对 reasoning_effort 的取值与 Ollama 不同（方舟用 minimal 而非 none），
  # 沿用 "none" 有被拒风险；需要关闭思考时优先改为空或 low。
  reasoning_effort: ""
  # 原来 512 是为省本机 CPU/GPU 而设，云端没有这个约束，
  # 保持 512 会把答案拦腰截断。按需放宽。
  max_completion_tokens: 4096

session_dir: "data/sessions"
session:
  store: "file" # .env 的 SESSION_STORE=mysql 会覆盖此默认值
  max_messages: 20
  max_chars: 12000
  expire_days: 30

skills:
  dir: "skills"
  default: ""

runtime:
  # 云端首字延迟远低于本地，180s 已无必要；缩短可让卡死请求更快失败。
  request_timeout: 60s
  # 原来 2 是为保护本机推理资源。云端不受此限，
  # 企业内部多人同时用时会成为瓶颈，先提到 8 观察。
  max_concurrency: 8
  # per-user（未认证时 per-IP）限流，只作用于 POST /chat 与 GET /ws（步骤 5.2）。
  # 单副本、进程内计数；多副本部署需换成 Redis。
  # 云端按量计费，这里的 max_concurrency: 8 意味着一个脚本能同时打满 8 路计费调用，
  # 限流是这条配置的必要配套。
  rate_limit:
    enabled: true
    per_minute: 30
    burst: 10

# Agent 只能读取 roots 中的 UTF-8 文本或 DOCX 正文，不能越界、写入或执行文件。
local_files:
  enabled: true
  roots:
    - "workspace-files"
    - 'E:\11\work'
  max_bytes: 10485760

execution_events:
  enabled: true
  queue_size: 256
  retention_days: 7
  max_events_per_run: 5000
  dir: "data/executions"

# 登录认证与多用户隔离。enabled: false 时以单用户模式运行，行为与改造前一致；
# 部署态在最后一步（5.5）置 true，并同步把 memory.identity_mode 改为 multi_user。
auth:
  enabled: false
  provider: feishu
  app_id: ""               # 建议用环境变量 FEISHU_APP_ID 注入，不写进仓库
  app_secret: ""           # 同上，FEISHU_APP_SECRET
  redirect_url: ""         # 必须与飞书后台登记值完全一致；FEISHU_REDIRECT_URL
  session_ttl: 12h
  cookie_secure: false     # 内网 http 部署必须 false，否则浏览器不保存 Cookie
  # 项目自有账号（例外通道）：仅管理员用 go run ./cmd/user-admin 建号，无注册接口。
  # 与 auth.enabled 独立；auth.enabled 为 true 时它是飞书之外的另一条登录入口，
  # 只启用它、不填飞书凭据也是合法组合。
  local:
    enabled: true
    min_password_length: 8   # 口令长度下限；上限固定 128 字节（防 PBKDF2 DoS）

agent:
  multi_agent: true
  checkpoint_dir: "data/checkpoints"

# 自动记忆：需先执行 go run ./cmd/session-migrate。
memory:
  enabled: true
  identity_mode: "local_single_user" # 接入飞书登录后改为多用户模式
  owner_id: "local-owner"
  project_id: "my-eino-app"
  auto_extract: true
  extractor_model: "inherit_chat"
  embedding_config: "inherit_rag"
  # 换 embedding 模型后旧集合里的向量已不可比，用新集合名隔离，
  # 旧集合保留可回滚。集合名必须与下面 rag.milvus.collection 不同。
  milvus_collection: "my_eino_memory_v2"
  vectorize_types: ["project_fact", "decision", "milestone", "todo"]
  extraction_context_messages: 8
  max_candidates: 5
  max_candidate_chars: 500
  worker_concurrency: 1
  task_timeout: 120s
  lease_duration: 180s
  max_attempts: 5
  retry_initial_delay: 2s
  retry_max_delay: 60s
  retrieval_top_k: 5
  max_context_chars: 2000
  audit_retention_days: 30
  turn_retention_days: 30
  job_success_retention_days: 7
  job_failed_retention_days: 30
  source_retention_days: 90
  version_keep_count: 3
  cleanup_batch_size: 500
  cleanup_interval: 24h

# 开启后输出模型调用、工具调用及耗时日志
debug: true

# 必须关闭！CheckOllama 请求的是 Ollama 专有端点 {base}/api/tags，
# 方舟上没有这个路径，开启会导致服务启动直接失败。
# 关闭后 main.go 会跳过健康检查（见 cmd/server/main.go 的 Ollama.HealthCheck 分支）。
ollama:
  health_check: false
  timeout: 60s

retry:
  max_attempts: 3
  base_delay: 1s
  max_delay: 10s

rag:
  enabled: true
  store: "milvus"
  document_dir: "docs/knowledge"
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  # 必改：0.50 是按本地 bge-m3 实测校准的，换 embedding 模型后相似度分布会整体偏移，
  # 直接沿用会误杀或放行。切换后先用 `make retrieve` 观察原始分数再定阈值。
  score_threshold: 0.35
  max_context_chars: 6000
  # 必须与所选 embedding 模型的实际输出维度一致，否则入库即失败。
  dimension: 1024
  embedding:
    api_key: "${ARK_API_KEY}"
    # 建议选纯文本向量化模型；若用多模态版本需确认输入格式是否为标准 OpenAI 字符串数组。
    # 以控制台实际模型 ID 为准。
    model: "doubao-embedding-text-240515"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    index: "my_eino_knowledge"
    key_prefix: "knowledge:"
  milvus:
    address: "localhost:19530"
    username: ""
    password: ""
    # 换 embedding 后写入全新集合，避免与旧向量混存。
    collection: "my_eino_knowledge_v2"
