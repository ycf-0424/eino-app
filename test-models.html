<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>测试模型选择功能</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #fff; border: 1px solid #ddd; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>模型选择功能测试</h1>

    <button onclick="testModels()">测试 /models 接口</button>
    <button onclick="testHealth()">测试 /health 接口</button>
    <button onclick="openApp()">打开主应用</button>

    <div id="output"></div>

    <script>
        async function testModels() {
            const output = document.getElementById('output');
            try {
                const response = await fetch('/models');
                const data = await response.json();
                output.innerHTML = `
                    <div class="result">
                        <h3>✓ /models 接口响应成功</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                output.innerHTML = `<div class="result" style="color: red;">✗ 错误: ${error.message}</div>`;
            }
        }

        async function testHealth() {
            const output = document.getElementById('output');
            try {
                const response = await fetch('/health');
                const data = await response.json();
                output.innerHTML = `
                    <div class="result">
                        <h3>✓ /health 接口响应成功</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                output.innerHTML = `<div class="result" style="color: red;">✗ 错误: ${error.message}</div>`;
            }
        }

        function openApp() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
