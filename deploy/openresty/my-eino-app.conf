# 1Panel/OpenResty 反向代理模板。
# 在 1Panel 网站设置中绑定域名和证书后，将 server_name、证书路径替换为实际值。
# 应用只监听 127.0.0.1:18180；MySQL、Milvus、etcd、MinIO 均没有宿主机端口。

limit_req_zone $binary_remote_addr zone=eino_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream eino_app {
    server 127.0.0.1:18180 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name eino.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eino.example.com;

    ssl_certificate     /www/server/panel/vhost/cert/eino.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/eino.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;

    location = /auth/local {
        limit_req zone=eino_login burst=10 nodelay;
        proxy_pass http://eino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/callback {
        limit_req zone=eino_login burst=10 nodelay;
        proxy_pass http://eino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 指标仅允许管理网段访问；应用仍要求 Authorization: Bearer token。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://eino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        proxy_pass http://eino_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://eino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_buffering off;
    }
}
