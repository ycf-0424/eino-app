# Docker 容器专用配置。容器通过 host.docker.internal 访问 Windows 上的 Ollama，
# 通过 Compose 服务名 milvus 访问同一 Docker 网络中的向量数据库。
openai:
  api_key: "ollama"
  model: "qwen3.5:9b"
  base_url: "http://host.docker.internal:11434/v1"
  reasoning_effort: "none"
  max_completion_tokens: 2048
  # Set the local model server's effective context window; zero uses legacy session caps.
  context_window_tokens: 0

session_dir: "data/sessions"
session:
  # 自动记忆启用时必须使用 MySQL；Compose 仍可通过 SESSION_STORE 显式覆盖。
  store: "mysql"
  # context_window_tokens 为 0 时使用以下传统限制。
  max_messages: 20
  max_chars: 12000
  # 配置模型窗口后使用的绝对保护上限。
  hard_max_messages: 200
  hard_max_chars: 300000
  max_summary_chars: 4000
  context_safety_tokens: 8192
  expire_days: 30

skills:
  dir: "skills"
  default: ""

runtime:
  request_timeout: 180s
  max_concurrency: 2
  queue_limit: 4
  queue_timeout: 10s
  # per-user（未认证时 per-IP）限流，只作用于 POST /chat 与 GET /ws（步骤 5.2）。
  # 单副本、进程内计数；多副本部署需换成 Redis。
  rate_limit:
    enabled: true
    per_minute: 30
    burst: 10

# 容器只能看到已挂载目录；workspace-files 由 Compose 挂载到应用工作目录。
local_files:
  enabled: true
  roots:
    - "workspace-files"
  max_bytes: 10485760

document_tools:
  enabled: true
  output_dir: "data/documents"
  max_bytes: 26214400

skill_tools:
  enabled: true
  writable_dir: "data/skills"
  templates_dir: "data/templates"
  allow_network: true
  allowed_hosts: ["github.com"]
  max_package_bytes: 52428800
  max_file_count: 256

# P8 实时执行进度；默认关闭，Compose 可通过环境变量或配置文件灰度开启。
execution_events:
  enabled: true
  queue_size: 256
  retention_days: 7
  max_events_per_run: 5000
  dir: "data/executions"

# 登录认证与多用户隔离。false 时以单用户模式运行、行为与改造前一致。
# 2026-09-17 提前置 true（原计划在步骤 5.5 切换）：飞书凭据仍未配置，因此
# 当前唯一入口是 auth.local 的项目自有账号（ValidateAuth 允许这种组合）。
auth:
  enabled: true
  provider: feishu
  app_id: ""               # 建议用环境变量 FEISHU_APP_ID 注入，不写进仓库
  app_secret: ""           # 同上，FEISHU_APP_SECRET
  redirect_url: ""         # 必须与飞书后台登记值完全一致；FEISHU_REDIRECT_URL
  session_ttl: 12h
  cookie_secure: false     # bootstrap/开发可为 false；生产 HTTPS 切换为 true
  # 项目自有账号（例外通道）：仅管理员用 go run ./cmd/user-admin 建号，无注册接口。
  # 与 auth.enabled 独立；auth.enabled 为 true 时它是飞书之外的另一条登录入口，
  # 只启用它、不填飞书凭据也是合法组合 —— 但这条「合法」有个副作用：
  # 上面三个飞书字段为空时服务照常启动，登录页只是静默少了飞书按钮，不报任何错。
  # 容器里要真拿到凭据，必须靠 docker-compose.milvus.yml 的 app.environment 透传
  # （compose 读 .env 只做变量插值，不会把变量注入容器）。
  local:
    enabled: true
    min_password_length: 8   # 口令长度下限；上限固定 128 字节（防 PBKDF2 DoS）

agent:
  multi_agent: true
  checkpoint_dir: "data/checkpoints"

# Phase 6 features remain disabled until a real source/provider is configured.
intent_routing:
  enabled: false
  confidence_threshold: 0.7
  classifier_timeout: 8s
dataquery:
  enabled: false
attachments:
  enabled: false
  storage_dir: "data/attachments"
  max_file_bytes: 10485760
  max_files_per_request: 3
  max_pages: 10
  retention_days: 30
  processing_timeout: 2m
  virus_scanner: "clamscan"
  virus_database_dir: "data/clamav"
  max_media_duration_seconds: 600
  max_video_frames: 12
  pdf_renderer: "pdftoppm"
  ffmpeg: "ffmpeg"
  ffprobe: "ffprobe"
  vision:
    enabled: false
    timeout: 60s
  transcription:
    enabled: false
    timeout: 60s

memory:
  enabled: true
  # 与 auth.enabled 配套：owner 改为来自登录态，下面这行 owner_id 不再作为身份
  # 来源（启动时会打一条 "is ignored" 日志）。历史数据挂在 local-owner 下，
  # 换模式后登录用户读不到，需要时用 session-migrate -claim-owner 重新归属。
  identity_mode: "multi_user"
  owner_id: "local-owner"
  project_id: "my-eino-app"
  auto_extract: true
  extractor_model: "inherit_chat"
  embedding_config: "inherit_rag"
  milvus_collection: "my_eino_memory_v1"
  vectorize_types: ["project_fact", "decision", "milestone", "todo"]
  extraction_context_messages: 8
  max_candidates: 5
  max_candidate_chars: 500
  worker_concurrency: 1
  task_timeout: 120s
  lease_duration: 180s
  max_attempts: 5
  retry_initial_delay: 2s
  retry_max_delay: 60s
  retrieval_top_k: 5
  max_context_chars: 2000
  audit_retention_days: 30
  turn_retention_days: 30
  job_success_retention_days: 7
  job_failed_retention_days: 30
  source_retention_days: 90
  version_keep_count: 3
  cleanup_batch_size: 500
  cleanup_interval: 24h

debug: false

ollama:
  health_check: true
  timeout: 60s

retry:
  max_attempts: 3
  base_delay: 1s
  max_delay: 10s

rag:
  enabled: true
  store: "milvus"
  document_dir: "docs/knowledge"
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  score_threshold: 0.50
  max_context_chars: 6000
  dimension: 1024
  embedding:
    api_key: "ollama"
    model: "bge-m3"
    base_url: "http://host.docker.internal:11434/v1"
  redis:
    addr: "redis-stack:6379"
    password: ""
    db: 0
    index: "my_eino_knowledge"
    key_prefix: "knowledge:"
  milvus:
    address: "milvus:19530"
    username: ""
    password: ""
    collection: "my_eino_knowledge"
