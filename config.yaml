# my-eino-app 的唯一通用配置入口
# 本地 Qwen、火山方舟和自动路由统一配置在下面的 models / agent.auto_routing 中。
# API Key 建议放在 .env，再通过 ${ENV_NAME} 引用。

# 多模型配置（可选）：定义多个可切换的模型
# 前端会在输入框右下角显示模型选择器，用户可以在对话中切换
# context_window_tokens 填实际模型窗口；设为 0 时该模型沿用 max_messages/max_chars 固定上限。
models:
  - id: qwen-fast
    provider: ollama
    model: qwen3.5:9b
    base_url: http://localhost:11434/v1
    reasoning_effort: none
    max_completion_tokens: 1024
    context_window_tokens: 0 # 填该模型提供商声明的总上下文 Token 数；0 表示未知并沿用会话固定上限
  - id: doubao-seed-evolving
    provider: volcengine-ark
    api_key: "${ARK_API_KEY}"
    model: doubao-seed-evolving
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    reasoning_effort: none
    max_completion_tokens: 4096
    context_window_tokens: 0
  - id: glm-ark
    provider: volcengine-ark
    api_key: "${ARK_API_KEY}"
    model: glm-5-3-flash-260828
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    reasoning_effort: none
    max_completion_tokens: 4096
    context_window_tokens: 0
  - id: deepseek-ark
    provider: volcengine-ark
    api_key: "${ARK_API_KEY}"
    model: deepseek-v4-1-flash-260910
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    reasoning_effort: none
    max_completion_tokens: 4096
    context_window_tokens: 0
  - id: doubao-seed-2-1-lite
    provider: volcengine-ark
    api_key: "${ARK_API_KEY}"
    model: doubao-seed-2-1-lite-260915
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    reasoning_effort: none
    max_completion_tokens: 4096
    context_window_tokens: 0
  - id: doubao-seed-2-1-turbo
    provider: volcengine-ark
    api_key: "${ARK_API_KEY}"
    model: doubao-seed-2-1-turbo-260628
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    reasoning_effort: none
    max_completion_tokens: 4096
    context_window_tokens: 0

# 默认激活的模型 ID（对应上面 models 列表中的 id）
active_model: qwen-fast

# 对话历史保存目录；程序重启后可通过 --session 恢复
session_dir: "data/sessions"
session:
  store: "file" # .env 的 SESSION_STORE=mysql 会覆盖此默认值
  # 模型窗口未配置（context_window_tokens: 0）时使用下面这组传统限制。
  max_messages: 20
  max_chars: 12000
  # 配置模型窗口时，按 Token 预算裁剪；下面两项仅作绝对保护上限。
  hard_max_messages: 200
  hard_max_chars: 300000
  max_summary_chars: 4000
  context_safety_tokens: 8192
  expire_days: 30

skills:
  dir: "skills"
  default: ""

runtime:
  request_timeout: 180s
  max_concurrency: 2
  queue_limit: 4
  queue_timeout: 10s
  # per-user（未认证时 per-IP）限流，只作用于 POST /chat 与 GET /ws（步骤 5.2）。
  # 单副本、进程内计数；多副本部署需换成 Redis。
  rate_limit:
    enabled: true
    per_minute: 30
    burst: 10

# Agent 只能读取 roots 中的 UTF-8 文本或 DOCX 正文，不能越界、写入或执行文件。
# 如需读取其他系统目录，请在 roots 中显式添加绝对路径，例如 C:\Users\Administrator\Documents。
local_files:
  enabled: true
  roots:
    - "workspace-files"
    # 示例：允许读取 E:\11\work 下的项目文档（请确认该目录可信）。
    - 'E:\11\work'
  max_bytes: 10485760

# P8 实时执行进度与执行记录；默认关闭，关闭时行为与 P7 完全一致。
# 关闭状态下不采集、不传输、不落库，可在出现问题时不改代码直接回滚。
execution_events:
  enabled: true
  queue_size: 256          # WebSocket 出站队列容量；满时中间事件可丢，终态必须送达
  retention_days: 7        # 执行记录保留天数
  max_events_per_run: 5000 # 单个 run 落库的事件上限
  dir: "data/executions"   # 文件后端的执行日志目录

# 登录认证与多用户隔离。访客可以先打开首页，但创建会话和发送消息前必须登录。
auth:
  enabled: true
  provider: feishu
  app_id: ""               # 建议用环境变量 FEISHU_APP_ID 注入，不写进仓库
  app_secret: ""           # 同上，FEISHU_APP_SECRET
  redirect_url: ""         # 必须与飞书后台登记值完全一致；FEISHU_REDIRECT_URL
  session_ttl: 12h
  cookie_secure: false     # 内网 http 部署必须 false，否则浏览器不保存 Cookie
  # 项目自有账号（例外通道）：仅管理员用 go run ./cmd/user-admin 建号，无注册接口。
  # 与 auth.enabled 独立；auth.enabled 为 true 时它是飞书之外的另一条登录入口，
  # 只启用它、不填飞书凭据也是合法组合。
  local:
    enabled: true
    min_password_length: 8   # 口令长度下限；上限固定 128 字节（防 PBKDF2 DoS）

agent:
  multi_agent: true
  checkpoint_dir: "data/checkpoints"
  # 自动模式：先用 Qwen 9B 判断任务难度，再选择一个最终模型。
  # 简单问题走 qwen-fast；复杂问题、分类失败或低置信度走 strong_model。
  # 用户手动选择具体模型时，所有 Agent 都统一使用该模型。
  auto_routing:
    enabled: true
    fast_model: qwen-fast
    strong_model: deepseek-ark
    confidence_threshold: 0.7
    classifier_timeout: 8s

# 自动记忆：需先执行 go run ./cmd/session-migrate。
# 用户偏好保存在 MySQL；项目决策/里程碑才会进入独立 Milvus 集合。
memory:
  enabled: true
  identity_mode: "multi_user"
  owner_id: ""
  project_id: "my-eino-app"
  auto_extract: true
  extractor_model: "inherit_chat"
  embedding_config: "inherit_rag"
  milvus_collection: "my_eino_memory_v1"
  vectorize_types: ["project_fact", "decision", "milestone", "todo"]
  extraction_context_messages: 8
  max_candidates: 5
  max_candidate_chars: 500
  worker_concurrency: 1
  task_timeout: 120s
  lease_duration: 180s
  max_attempts: 5
  retry_initial_delay: 2s
  retry_max_delay: 60s
  retrieval_top_k: 5
  max_context_chars: 2000
  audit_retention_days: 30
  turn_retention_days: 30
  job_success_retention_days: 7
  job_failed_retention_days: 30
  source_retention_days: 90
  version_keep_count: 3
  cleanup_batch_size: 500
  cleanup_interval: 24h

# 开启后输出模型调用、工具调用及耗时日志
debug: true

ollama:
  health_check: true
  timeout: 60s                   # 首次加载 bge-m3 可能较慢，避免健康检查误判超时

# 模型请求重试策略
retry:
  max_attempts: 3
  base_delay: 1s
  max_delay: 10s

# RAG 知识库；需要先启动 Redis Stack 并执行 cmd/indexer
rag:
  enabled: true                     # 已启用 RAG，当前使用本地 Milvus
  store: "milvus"                 # 可选 redis 或 milvus
  document_dir: "docs/knowledge"
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  score_threshold: 0.50           # 根据本地 bge-m3 评测校准；事实问题最低约 0.54
  max_context_chars: 6000
  dimension: 1024                 # Ollama bge-m3 的向量维度
  embedding:
    api_key: "ollama"
    model: "bge-m3"
    base_url: "http://localhost:11434/v1"
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    index: "my_eino_knowledge"
    key_prefix: "knowledge:"
  milvus:
    address: "localhost:19530"
    username: ""
    password: ""
    collection: "my_eino_knowledge"
